services:
  - type: web
    name: professional-service-platform
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPI_ID
        value: 7002581794@upi
      - key: GPLAY_NUMBER
        value: "7002581794"
      - key: WHATSAPP_NUMBER
        value: "917002581794"
